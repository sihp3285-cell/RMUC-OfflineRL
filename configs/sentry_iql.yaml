# Sentry (哨兵) — primary offline-RL config: IQL.
algo: iql
data: data/sentry          # output of build_dataset.py
out: runs/sentry_iql
seed: 0

model:
  hidden: 256
  depth: 2

iql:
  gamma: 0.99
  expectile: 0.7           # tau; higher = more optimistic value
  beta: 1.0                # AWR temperature (lower = stabler, less peaky weights)
  adv_max: 100.0
  polyak: 0.005
  use_quality_weight: false # weight policy loss by team strength
  reward_scale: auto        # 'auto' = 1/std(reward); keeps Q/V from inflating

train:
  batch_size: 1024         # per-GPU
  max_steps: 100000        # this data converges early; more only degrades AWR
  lr: 3.0e-4
  weight_decay: 0.0
  warmup: 1000
  grad_clip: 1.0
  num_workers: 4
  log_every: 200
  eval_every: 5000
  ckpt_every: 10000        # checkpoint often so you can pick the best

# Reward weights consumed by build_dataset.py (define good vs bad behaviour).
# Sentry is a defensive unit: own-outpost/base preservation, own survival and
# local attrition dominate; base attack is upweighted but rarely triggers.
reward:
  w_outpost_atk: 3.0
  w_base_atk: 5.0
  w_dmg_deal: 1.0
  w_kill: 2.0
  w_outpost_def: 4.0
  w_base_def: 6.0
  w_dmg_take: 1.0
  w_death: 2.0
  w_ego_surv: 0.02
  w_ego_hp: 1.5
  w_heat: 0.5
  w_econ: 0.5
  w_win: 20.0
  w_final_base: 5.0
