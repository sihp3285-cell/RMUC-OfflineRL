# Sentry IQL — navigation-goal action instead of raw velocity.
# The movement action becomes "where to be ~5 s from now" (a sub-goal the
# on-board planner drives to), which is higher-level, less jittery, and
# deployable without perfect radar/state. Needs its own dataset build
# (--action-mode goal). Includes the v2 reward fix (w_ego_hp 0.2).
algo: iql
data: data/sentry_goal
out: rm_runs/sentry_iql_goal
seed: 0

model: {hidden: 256, depth: 2}

iql:
  gamma: 0.99
  expectile: 0.7
  beta: 1.0
  adv_max: 100.0
  polyak: 0.005
  use_quality_weight: false
  reward_scale: auto

train:
  batch_size: 1024
  max_steps: 100000
  lr: 3.0e-4
  weight_decay: 0.0
  warmup: 1000
  grad_clip: 1.0
  num_workers: 4
  log_every: 200
  eval_every: 5000
  ckpt_every: 10000

reward:
  w_outpost_atk: 3.0
  w_base_atk: 5.0
  w_dmg_deal: 1.0
  w_kill: 2.0
  w_outpost_def: 4.0
  w_base_def: 6.0
  w_dmg_take: 1.0
  w_death: 2.0
  w_ego_surv: 0.02
  w_ego_hp: 0.2
  w_heat: 0.5
  w_econ: 0.5
  w_win: 20.0
  w_final_base: 5.0
