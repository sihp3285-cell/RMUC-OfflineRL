# Decision Transformer on the tactical action space.
# Its prediction head is now mixed-type too (tanh nav + fire logit + target
# logits), so it is not forced to squeeze a 7-way categorical through a
# Gaussian/MSE head.  n_embd bumped 128 -> 192 to match the wider observation.
algo: dt
data: data/infantry_tactical
out: rm_runs/infantry_dt_tactical
seed: 0

dt:
  ctx: 30
  n_embd: 128
  n_layer: 3
  n_head: 4
  dropout: 0.1
  gamma: 1.0
  rtg_scale: 100.0
  max_timestep: 512

train:
  batch_size: 128
  max_steps: 20000
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup: 1000
  grad_clip: 0.25
  num_workers: 0        # forced to 0 in code: data is already an in-RAM tensor
  log_every: 200
  eval_every: 1000
  ckpt_every: 5000
  early_stop_patience: 8

reward:
  w_outpost_atk: 3.0
  w_base_atk: 5.0
  w_dmg_deal: 1.0
  w_kill: 2.0
  w_outpost_def: 4.0
  w_base_def: 6.0
  w_dmg_take: 1.0
  w_death: 2.0
  w_ego_surv: 0.02
  w_ego_hp: 0.2
  w_heat: 0.5
  w_econ: 0.5
  w_win: 20.0
  w_final_base: 5.0
