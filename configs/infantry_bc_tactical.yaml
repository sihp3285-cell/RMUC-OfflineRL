# BC baseline on the tactical action space — the control for "did the richer
# observation + discrete heads help, or did IQL just get luckier?".
# Same data and same capacity as sentry_iql_tactical.yaml so the comparison is
# apples-to-apples.
algo: bc
data: data/infantry_tactical
out: rm_runs/infantry_bc_tactical
seed: 0

model: {hidden: 256, depth: 2}

bc:
  return_beta: 1.0          # %BC: up-weight high-return episodes
  use_quality_weight: false

train:
  batch_size: 1024
  max_steps: 15000
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup: 500
  grad_clip: 1.0
  num_workers: 0        # forced to 0 in code: data is already an in-RAM tensor
  log_every: 200
  eval_every: 1000
  ckpt_every: 5000
  select_metric: action_mse
  early_stop_patience: 8

reward:
  w_outpost_atk: 3.0
  w_base_atk: 5.0
  w_dmg_deal: 1.0
  w_kill: 2.0
  w_outpost_def: 4.0
  w_base_def: 6.0
  w_dmg_take: 1.0
  w_death: 2.0
  w_ego_surv: 0.02
  w_ego_hp: 0.2
  w_heat: 0.5
  w_econ: 0.5
  w_win: 20.0
  w_final_base: 5.0
